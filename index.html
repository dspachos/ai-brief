<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The AI Brief — Daily AI News</title>
  <meta name="description" content="A daily briefing on AI: news, tools, research, deals, and markets.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 antialiased min-h-screen">
  <main class="max-w-2xl mx-auto px-6">

    <header class="pt-16 pb-10 border-b border-zinc-800/80">
      <p class="font-mono text-xs tracking-[0.2em] text-cyan-400/90 uppercase">Daily · AI News Briefing</p>
      <h1 class="mt-3 text-4xl font-semibold tracking-tight text-zinc-50">The AI Brief</h1>
      <p class="mt-3 text-zinc-400 leading-relaxed">What moved in AI today — news, tools, deals, and markets, in one page.</p>
    </header>

    <section x-data="brief()">
      <div x-show="!loaded && !error" class="py-10 space-y-4">
        <div class="h-4 w-24 bg-zinc-800 rounded animate-pulse"></div>
        <div class="h-6 w-3/4 bg-zinc-800 rounded animate-pulse"></div>
        <div class="h-3 w-full bg-zinc-800/60 rounded animate-pulse"></div>
      </div>

      <p x-show="error" class="py-10 text-zinc-500 text-sm">Couldn't load <code class="font-mono">posts.json</code>.</p>

      <template x-for="post in posts" :key="post.date">
        <article class="py-8 border-b border-zinc-800/80">
          <a :href="post.file" class="group block">
            <time class="font-mono text-xs text-cyan-400/80" x-text="fmt(post.date)"></time>
            <h2 class="mt-2 text-xl font-medium text-zinc-100 group-hover:text-white transition-colors" x-text="post.title"></h2>
            <p class="mt-2 text-sm text-zinc-400 leading-relaxed" x-text="post.summary"></p>
            <span class="mt-3 inline-block text-sm text-cyan-400 group-hover:text-cyan-300">Read briefing →</span>
          </a>
        </article>
      </template>

      <p x-show="loaded && !error && posts.length === 0" class="py-10 text-zinc-500 text-sm">No briefings yet.</p>
    </section>

    <footer class="py-10 text-xs text-zinc-500 leading-relaxed">
      Assembled daily by a <a href="https://github.com/earendil-works/pi-coding-agent" class="text-zinc-400 hover:text-zinc-200 underline underline-offset-2">pi</a> agent from Exa search, RSS feeds, and market data. Every item links its source.
    </footer>
  </main>

  <script>
    function brief() {
      return {
        posts: [],
        loaded: false,
        error: false,
        fmt(d) {
          return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
        },
        async init() {
          try {
            const res = await fetch('posts.json');
            this.posts = (await res.json()).sort((a, b) => b.date.localeCompare(a.date));
          } catch (e) { this.error = true; }
          this.loaded = true;
        }
      };
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The AI Brief — Daily AI News</title>
  <meta name="description" content="A daily briefing on AI: news, tools, research, deals, and markets.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#f5f4ed',
            ink: '#33322c',
            body: '#4a483f',
            muted: '#756f60',
            hair: '#ddd8c8',
            brand: '#1B365D',
            gain: '#4a7c59',
            loss: '#a35252'
          },
          fontFamily: {
            serif: ['Charter', 'Bitstream Charter', 'Georgia', 'Times New Roman', 'serif'],
            mono: ['ui-monospace', 'SF Mono', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-paper text-body font-serif antialiased min-h-screen">
  <main class="max-w-2xl mx-auto px-6">

    <header class="pt-16 pb-10 border-b border-hair">
      <p class="font-mono text-[11px] tracking-[0.25em] text-brand uppercase">Daily · AI News Briefing</p>
      <h1 class="mt-3 text-4xl font-semibold tracking-tight text-ink">The AI Brief</h1>
      <p class="mt-3 text-muted leading-relaxed">What moved in AI today — news, tools, deals, and markets, in one page.</p>
    </header>

    <section x-data="brief()">
      <div x-show="!loaded && !error" class="py-10 space-y-4">
        <div class="h-4 w-24 bg-hair rounded animate-pulse"></div>
        <div class="h-6 w-3/4 bg-hair rounded animate-pulse"></div>
        <div class="h-3 w-full bg-hair/60 rounded animate-pulse"></div>
      </div>

      <p x-show="error" class="py-10 text-muted text-sm">Couldn't load <code class="font-mono">posts.json</code>.</p>

      <template x-if="loaded && !error && posts.length">
        <article class="py-8 border-b border-hair">
          <p class="font-mono text-[11px] tracking-[0.25em] text-muted uppercase">Latest briefing</p>
          <a :href="posts[0].file" class="group mt-3 block">
            <time class="font-mono text-xs text-brand" x-text="fmt(posts[0].date)"></time>
            <h2 class="mt-2 text-2xl font-semibold text-ink group-hover:text-brand transition-colors" x-text="posts[0].title"></h2>
            <p class="mt-3 text-sm text-body leading-relaxed" x-text="posts[0].summary"></p>
            <span class="mt-4 inline-block text-sm text-brand underline underline-offset-4 decoration-hair group-hover:decoration-brand">Read briefing →</span>
          </a>
        </article>
      </template>

      <p x-show="loaded && !error && posts.length === 0" class="py-10 text-muted text-sm">No briefings yet.</p>

      <nav class="py-6">
        <a href="archive.html" class="text-sm text-muted hover:text-brand">Browse all briefings →</a>
      </nav>
    </section>

    <footer class="py-10 text-xs text-muted leading-relaxed">
      Assembled daily by a <a href="https://github.com/earendil-works/pi-coding-agent" class="text-brand hover:underline underline-offset-2">pi</a> agent from Exa search, RSS feeds, and market data. Every item links its source.
    </footer>
  </main>

  <script>
    function brief() {
      return {
        posts: [],
        loaded: false,
        error: false,
        fmt(d) {
          return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
        },
        async init() {
          try {
            const res = await fetch('posts.json');
            this.posts = (await res.json()).sort((a, b) => b.date.localeCompare(a.date));
          } catch (e) { this.error = true; }
          this.loaded = true;
        }
      };
    }
  </script>
</body>
</html>
